# yaml-language-server: $schema=https://unpkg.com/@powersync/service-schema@latest/json-schema/powersync-config.json

_type: self-hosted

port: !env PS_PORT

replication:
  connections:
    - type: postgresql
      uri: !env PS_DATA_SOURCE_URI
      sslmode: disable

storage:
  type: postgresql
  uri: !env PS_STORAGE_URI
  sslmode: disable

sync_config:
  path: ./sync-config.yaml

client_auth:
  jwks:
    keys:
      - kty: oct
        alg: HS256
        kid: !env PS_JWT_KID
        k: !env PS_JWT_SECRET_B64
  audience:
    - !env PS_JWT_AUDIENCE

telemetry:
  disable_telemetry_sharing: true
  prometheus_port: !env PS_TELEMETRY_PORT

api:
  tokens:
    - !env PS_API_TOKEN
